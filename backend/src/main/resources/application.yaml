spring:
  application:
    name: stacklight-backend

  datasource:
    # Neon DIRECT endpoint (no "-pooler"): PgBouncer transaction pooling conflicts
    # with the JDBC driver's server-side prepared statements.
    hikari:
      pool-name: stacklight-pool
      maximum-pool-size: 3
      # Neon Free bills compute by CU-hour and only suspends when no client is
      # connected. The three settings below let the pool drain to zero so the
      # database can actually scale to zero while this service is idle.
      minimum-idle: 0
      idle-timeout: 30000
      keepalive-time: 0
      max-lifetime: 600000
      connection-timeout: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Deliberately off: /actuator/health is the uptime-ping target, and a DB
    # check on every ping would keep the Neon compute awake around the clock.
    db:
      enabled: false
    # Off for the stronger version of the same rule. Adding the mail starter brings
    # an indicator that opens an SMTP connection on every health check, so with no
    # mail configured the endpoint reports DOWN and the platform concludes the whole
    # service is unhealthy -- over a feature that is optional by design. Liveness must
    # not depend on anything outside this process.
    mail:
      enabled: false

stacklight:
  grouping:
    # Which algorithm new events are grouped by. Changing this re-partitions
    # history -- old groups freeze where they are and still-occurring errors open
    # new ones -- so it moves only after GET /api/grouping/replay?version=N has
    # been read and the merges and splits it reports were the ones expected.
    active-version: ${GROUPING_ACTIVE_VERSION:1}

  ingest:
    api-key: ${INGEST_API_KEY:}
    # Beyond this many events per hour, a group keeps being counted but stops storing
    # detail. The trend stays truthful while storage stops growing.
    hourly-cap-per-group: 200

  retention:
    # Raw events only. Rollups are kept for good: they are the reason a trend still
    # works after the events behind it are gone.
    window-days: 14
    # Neon Free suspends the project when storage runs out rather than billing for it,
    # so the window tightens on its own as the events table approaches the limit.
    warn-bytes: 314572800        # 300 MB
    warn-window-days: 7
    critical-bytes: 419430400    # 400 MB
    critical-window-days: 3
    batch-size: 5000
    sweep-every-events: 200
    sweep-every-minutes: 10

  detection:
    # Every detector runs on every bucket; only this one may raise an alert. The others
    # are shadows, and the scorecard is what decides whether this stays the choice.
    # Chosen by the scorecard rather than by the argument for it. Over 111 judged hours
    # ewma and poisson caught the same nine surges and missed the same two, and poisson
    # raised thirteen false positives to ewma's four -- eleven of them on one service
    # degrading gradually, where the flat mean poisson fits lags the trend and reads the
    # gap as a surprise every hour. Changing this is a configuration change whose effect
    # was measured before it was made, which is what shadow mode is for.
    active: ${DETECTOR_ACTIVE:ewma}
    history-hours: 24
    min-history-hours: 6
    # The number that makes this domain different. 97% of group-hour buckets are empty,
    # so a baseline near zero makes any non-zero hour look infinitely unusual. Nothing
    # below this count is treated as a spike by any detector, whatever its score says.
    min-observed: 5
    ewma-alpha: 0.3
    ewma-multiplier: 3.0
    z-threshold: 3.0
    z-sigma-floor: 1.0
    poisson-probability: 0.001
    poisson-lambda-floor: 0.1
    new-group-window-hours: 2
    new-group-threshold: 10
    # One alert per group per kind per cooldown. This value is for the kinds raised by an
    # event arriving, whose repeats come as fast as events do.
    cooldown-minutes: 60
    score-after-hours: 3
    oracle-multiplier: 4.0

    silence:
      # The one signal the ingest path cannot produce, so these are read by the sweep.
      window-hours: 24
      # How long a group must have produced nothing to count as stopped.
      quiet-hours: 3
      # A habit, not a lull: below this the rule would fire on almost every group, since
      # 97% of group-hour buckets are empty.
      min-busy-hours: 6
      # A day, against 60 minutes for the event-driven kinds, and the difference is the
      # cadence rather than the severity. Silence is raised by a sweep every three hours,
      # so an hour-long cooldown expires before anything asks again and suppresses
      # nothing. A day outlasts the 19 hours a group can keep qualifying, which is what
      # makes an episode produce exactly one alert.
      cooldown-minutes: ${SILENCE_COOLDOWN_MINUTES:1440}

  alerting:
    # Blank turns delivery off without turning detection off: alerts are still found and
    # still recorded, they are just marked disabled rather than queued.
    to: ${ALERT_EMAIL_TO:}
    from: ${ALERT_EMAIL_FROM:}
    dashboard-url: ${DASHBOARD_URL:}
    max-attempts: 5
    drain-batch: 20

spring.mail:
  # Port 2525 rather than 587: Render blocks the usual submission port outbound.
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:2525}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true
    mail.smtp.connectiontimeout: 10000
    mail.smtp.timeout: 10000
    mail.smtp.writetimeout: 10000

logging:
  level:
    root: INFO
    dev.stacklight: INFO

name: traffic

# Sends one hour of a generated scenario to the collector.
#
# This is not real traffic and the README says so in the same words. It exists because
# the detector scorecard cannot compare three detectors on a deployment nobody uses: with
# three judged buckets they all sat at 100% and the choice of active detector rested on an
# argument rather than a measurement. It has since done its job -- the run finished, the
# scorecard filled, and the active detector changed on the strength of it.
#
# Rollup buckets are written as date_trunc('hour', now()), so history cannot be
# back-filled and the scenario has to be played against the wall clock. tools/traffic
# holds the schedule; this file only decides when to call it.
#
# ## Why there is no cron here any more
#
# There was one, at five, twenty-five and forty-five past. Once an hour had not survived
# contact with the scheduler -- of the first eighteen hours it fired for eleven, and the
# hours it dropped were the ones carrying the cases the detectors disagree about -- and
# running three times an hour was only safe because the generator sends the difference
# rather than the plan: it reads what the hour already holds and sends what is missing, so
# a tick that finds the hour complete makes no request to the collector at all.
#
# The schedule was thirty hours long and the generator stops itself once that has passed,
# so leaving the cron would have been harmless rather than costly: an idle tick returns
# before it reaches either the database or the collector. It would just have been seventy
# green runs a day saying nothing, which is a worse thing to leave in a repository than a
# workflow somebody has to press.
#
# Dispatch is kept rather than deleting the file. The schedule in tools/traffic is data
# and the run is reproducible from it; re-running means moving START_ISO and pressing this,
# which is a smaller thing to explain than a workflow that has to be reconstructed.

on:
  workflow_dispatch:

# One at a time, and the newest wins.
#
# The sweep queues instead, because a sweep that is still waiting out a cold start is
# doing the work and should be left to finish. This is the opposite case: an hour's
# traffic is only worth sending during that hour, so a run still going when the next one
# arrives has already missed its window and is in the way. Letting it queue would stall
# every hour behind it -- which is what happened when the first run hung, held the group,
# and could not be cancelled by either the API or the force endpoint.
concurrency:
  group: traffic
  cancel-in-progress: true

jobs:
  traffic:
    name: traffic
    runs-on: ubuntu-latest
    # A cold start is a hundred seconds and five services take a few more. Anything past
    # twenty minutes is stuck, and the default six hours is long enough to swallow a
    # thirty-hour schedule whole.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # No install step. The generator reports through the project's own client, which
      # has no dependencies, and that is half the point of using it rather than posting
      # JSON: every hour of this run is another test of the bounded queue and the
      # cold-start backoff against the real collector.
      # DATABASE_URL is the dashboard's role, which holds nothing but SELECT. It is read
      # to find out what the hour already has; nothing here writes to the database, and
      # the events still go through the collector like any other client's would.
      #
      # Neon's compute wakes for each of these reads and idles out again a few minutes
      # later, which over the rest of the run is a couple of compute-hours out of the
      # month's allowance. It is a fraction of what the same ticks would cost if they
      # woke the collector instead, which is the whole trade.
      - name: Send what this hour is still missing
        env:
          COLLECTOR_URL: ${{ secrets.COLLECTOR_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node tools/traffic/generate.mjs

name: sweep

# The scheduler that lives outside the process.
#
# The collector sleeps after fifteen idle minutes, so an in-process timer would
# fire into nothing. This wakes it instead, and the work runs on a service that
# is by then running. It exists for the one signal the ingest path cannot
# produce: a group that was reporting and stopped, which is raised by an event
# *not* arriving.
#
# Every three hours rather than every few minutes. Each run wakes the instance and
# keeps it up for the fifteen minutes Render waits before idling it out, so the
# cadence is a bill as much as a setting -- and a service woken constantly is no
# longer a service that sleeps, which is half of what this project demonstrates.
#
# It was hourly. The cadence is set by Render's quota rather than by what the
# signal deserves: 750 instance-hours a month are shared across every free service
# in the workspace, and hourly wakes spent 208 of them -- more than a quarter of
# the allowance on a service whose dashboard does not need it running at all.
# Three-hourly spends about 69.
#
# What that costs is latency, and only latency. A group is not judged the moment
# it goes quiet; it is judged when a sweep looks. So the delay between a reporter
# dying and an alert grows from at most one hour to at most three.
#
# It costs no coverage, because the thing being tested is a level rather than an
# edge. "No events in the last three hours" stays true for as long as the group
# stays quiet, so a sweep that arrives late still finds it true. A group with a
# genuine habit qualifies for roughly sixteen hours before its busy hours age out
# of the 24-hour window, and three-hourly sampling enters that window about five
# times. What a slower cadence really loses is a silence that starts and ends
# between two sweeps -- and a reporter that comes back by itself within three
# hours is not the failure this alert exists for.

on:
  schedule:
    # Seven past, not on the hour: the top of the hour is when every cron on the
    # platform fires, and the queue there is longer than the job.
    - cron: "7 */3 * * *"
  workflow_dispatch:

# One at a time. A run that is still waiting out a cold start should not be
# joined by the next one.
concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep
    runs-on: ubuntu-latest
    steps:
      - name: Wake the collector and sweep
        env:
          COLLECTOR_URL: ${{ secrets.COLLECTOR_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          if [ -z "$COLLECTOR_URL" ] || [ -z "$INGEST_API_KEY" ]; then
            echo "::notice::COLLECTOR_URL or INGEST_API_KEY is not set; nothing to sweep"
            exit 0
          fi

          # The first attempt against a sleeping collector is *supposed* to fail.
          # Cold start was measured at 95 to 116 seconds, and on one of those the
          # platform returned 503 rather than holding the connection open -- the
          # same measurement the SDKs were built around, so the same answer:
          # retry rather than treat one refusal as an outage.
          for attempt in 1 2 3 4 5; do
            status=$(curl -sS -o /tmp/sweep.json -w "%{http_code}" \
                          --max-time 120 -X POST \
                          -H "X-Stacklight-Key: $INGEST_API_KEY" \
                          "$COLLECTOR_URL/api/sweep" || echo "000")

            if [ "$status" = "200" ]; then
              echo "swept on attempt $attempt"
              cat /tmp/sweep.json
              exit 0
            fi

            echo "attempt $attempt: HTTP $status"
            sleep 30
          done

          echo "::error::the collector did not answer in five attempts"
          exit 1

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest

    # Both patterns live here rather than being repeated per step, because the
    # previous copies drifted: the file scan and the hook were each edited once
    # without the other. Kept in step with .githooks/commit-msg.
    env:
      # Authorship claims. "generated with/by" only counts when a tool name follows;
      # unqualified it is ordinary technical English -- "migration generated by the
      # CLI" -- and flagging that teaches people to route around the check.
      ATTRIBUTION: 'co-authored-by:[[:space:]]*(claude|copilot|cursor|codex|gpt|gemini|devin|bot)|generated (with|by).{0,40}(claude|copilot|cursor|codex|chatgpt|gemini|devin)|written by[[:space:]]+(an?[[:space:]]+)?(assistant|model)|claude\.ai|yapay zeka|üretken zeka'
      # Tool and workflow names. These leak through paths and prose rather than
      # through a Co-authored-by trailer, which is how a directory called
      # superpowers/ and a plan addressed to "agentic workers" reached a public
      # repository while every attribution check above it passed.
      #
      # Deliberately absent: a bare "cursor" (this repository pages with a keyset
      # cursor and styles with cursor-pointer) and a bare "agent" (AGENTS.md is a
      # vendor-neutral file the framework writes). Both are matched in their
      # tool-specific forms instead.
      TOOLING: 'agentic|superpowers?|sub-skills?|subagents?|claude|anthropic|openai|copilot|chatgpt|codex|gemini|devin|windsurf|aider|cursorrules|\.cursor/|[.-]mcp\b|\bmcp[.-]'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The commit-msg hook enforces this locally; re-running it here means
      # `--no-verify` cannot slip anything past unnoticed.
      - name: Commit messages
        run: |
          if git log --format='%H %B' | grep -Eni "$ATTRIBUTION|$TOOLING"; then
            echo "::error::attribution or tooling reference found in commit history"
            exit 1
          fi
          echo "commit history clean"

      # File and directory *names*, which no content grep can see. A file called
      # CLAUDE.md attributes the work in its name while its body says nothing,
      # and a docs/superpowers/ directory names the tool in every path under it.
      - name: File names
        run: |
          if git ls-files | grep -Eni "$TOOLING"; then
            echo "::error::tool-shaped file or directory name in the tree"
            exit 1
          fi
          echo "file names clean"

      - name: Tracked files
        run: |
          if git grep -InEi "$ATTRIBUTION|$TOOLING" -- . ':!.githooks/*' ':!.github/workflows/*'; then
            echo "::error::attribution or tooling reference found in tracked files"
            exit 1
          fi
          echo "tracked files clean"

      # The test count is on a badge, and a badge nobody checks is decoration that
      # eventually becomes a lie. Counting them automatically is harder than it looks --
      # one backend test is parameterised and expands to nine cases at run time, so a
      # grep for @Test reports 157 where the runner reports 166 -- so the number is
      # written down from what the runners said, and this makes sure the badge and the
      # table in the README cannot drift apart.
      - name: Test count
        run: |
          badge=$(grep -oE 'badge/tests-[0-9]+' README.md | head -1 | grep -oE '[0-9]+$')
          total=$(awk '/^\| \*\*Total\*\*/{if (match($0, /\*\*[0-9]+\*\*/)) {print substr($0, RSTART+2, RLENGTH-4); exit}}' README.md)
          sum=$(awk '/^### Tests, as they stand/{f=1}
                     f && /^\| \*\*Total\*\*/{exit}
                     f && /^\| [A-Z]/ {if (match($0, /\*\*[0-9]+\*\*/)) s+=substr($0, RSTART+2, RLENGTH-4)}
                     END{print s}' README.md)

          echo "badge=$badge  table total=$total  suites sum to=$sum"
          if [ "$badge" != "$total" ] || [ "$sum" != "$total" ]; then
            echo "::error::the tests badge, the total and the per-suite rows disagree"
            exit 1
          fi
          echo "tests badge agrees with the table"

      - name: Secrets
        run: |
          # Password class excludes < and > so documented placeholders such as
          # postgresql://<user>:<password>@<host> do not trip the check.
          pattern='npg_[A-Za-z0-9]{12,}|postgres(ql)?://[A-Za-z0-9_.-]+:[A-Za-z0-9_%.-]{12,}@|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -InE "$pattern" -- . ':!*.env.example' ':!.github/workflows/*'; then
            echo "::error::credential-shaped string found in tracked files"
            exit 1
          fi
          echo "no credentials in tree"

      # The whole architecture rests on the dashboard reaching Postgres and nothing
      # else: that is what lets it render in full while the ingestion service is
      # asleep.
      #
      # This is the cheap half of the guard and it is not the strong half. A grep sees
      # spelling, and two ways of breaking the claim were tried against the original
      # pattern before it was widened: an alias -- `const call = globalThis.fetch` --
      # and a `node:https` import. Both walked straight past it. The widened pattern
      # below catches those two, and the next person to break it will simply spell it a
      # third way.
      #
      # What actually holds the line is web/test/render/isolation.test.ts, which renders
      # every page with the socket watched and asserts that nothing was dialled. That
      # one sees the attempt rather than the spelling. This step stays because it is
      # free, it fails earlier, and it names the rule in the place people read.
      - name: Read path
        run: |
          # "fetch" needs the paren: lib/db.ts describes the driver as SQL-over-fetch
          # in a comment, and that is the thing being praised, not a call.
          # package-lock.json is excluded because Next.js pulls undici transitively.
          pattern='\bfetch[[:space:]]*\(|\baxios\b|node-fetch|\bundici\b|XMLHttpRequest'
          pattern="$pattern"'|onrender\.com|render\.com'
          pattern="$pattern"'|\bglobalThis\.fetch\b|node:https?|require\(.https?.\)'
          pattern="$pattern"'|\bEventSource\b|\bWebSocket\b|\bhttp\.request\b|\bhttps\.request\b'
          if git grep -InE "$pattern" -- web ':!web/package-lock.json' ':!web/test/render/isolation.test.ts'; then
            echo "::error::the dashboard read path reaches outside Postgres"
            exit 1
          fi
          echo "read path talks to Postgres only"

      # web/package-lock.json cannot be regenerated on a machine that does not need
      # every platform's binaries. npm prunes the optional entries it cannot use
      # locally and leaves the packages depending on them alone, so the file ends up
      # naming a dependency it no longer contains -- and reports success while doing
      # it. It has been produced twice here, both times dropping @emnapi/core and
      # @emnapi/runtime while three packages went on requiring them.
      #
      # The script makes two assertions and they are not equally good, the same way
      # the read-path grep above is not the equal of the dial-watch that backs it.
      #
      # The Linux-coverage half is the cheap one and it would not have caught either
      # of the two rewrites: through both of them the Linux count never moved, because
      # @emnapi carries no platform in its name. It is there for the other shape of
      # the accident -- a file that kept the binaries of whoever ran npm.
      #
      # What holds is the coherence half: every dependency the file names must resolve
      # inside it. That sees the consequence rather than any package in particular, so
      # the next thing npm prunes is caught without anybody having listed it here.
      - name: Lockfile
        run: node .github/scripts/lockfile-guard.mjs

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Integration tests start a real PostgreSQL 17 via Testcontainers, using
      # the Docker daemon the runner already provides.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Render builds from this Dockerfile. Building it here turns a deploy-time
      # failure into a pull-request failure.
      - name: Build container image
        working-directory: backend
        run: docker build -t stacklight-backend:ci .

  sdk-java:
    name: sdk-java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The SDK targets 17 rather than the collector's 21: it runs on somebody else's
      # classpath and cannot make their choice for them.
      - name: Build and test
        working-directory: sdk/java
        run: ./mvnw -B --no-transfer-progress verify

      # Built here so the example cannot rot into something that no longer compiles
      # against the starter it is meant to demonstrate.
      - name: Build the example against it
        run: |
          cd sdk/java && ./mvnw -B -q --no-transfer-progress -DskipTests install
          cd ../../examples/java-demo && ./mvnw -B -q --no-transfer-progress package

  sdk-node:
    name: sdk-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # No install step: the client has no dependencies, and the tests use the runtime's
      # own test runner for the same reason.
      - name: Test
        working-directory: sdk/node
        run: npm test

      - name: Check the examples parse
        run: |
          node --check examples/node-demo/demo.js
          node --check examples/node-demo/overflow.js

      # The traffic generator reports through this client, so it is built and tested in
      # the same job. The schedule is pure data and the tests are about what it must not
      # do: exceed the collector's hourly cap, outgrow the storage budget, or keep
      # running after its thirty hours are up.
      #
      # The test files are named rather than the directory: a directory argument
      # misresolves on Windows, where this also has to run.
      - name: Test the traffic scenario
        run: node --test tools/traffic/*.test.mjs

      - name: Check the generator parses
        run: node --check tools/traffic/generate.mjs

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      # node --test on TypeScript directly, which Node 24 runs without a
      # compile step. No test runner is installed: the dashboard's dependency
      # list is part of what it is.
      - name: Test
        working-directory: web
        run: npm test

      # Runs without DATABASE_URL on purpose: the dashboard must never reach the
      # database at build time.
      - name: Build
        working-directory: web
        run: npm run build
